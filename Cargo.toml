[package]
name = "handwired-rs"
version = "0.8.0"
edition = "2024"
description = "Exact f32 circuits from ordinary Rust: a port of chenglou/handwired"
readme = "README.md"
license = "MIT"
repository = "https://github.com/mighty840/handwired-rs"
keywords = ["neural-network", "circuit", "differentiable", "webgpu", "proc-macro"]
categories = ["science", "compilers"]

[dependencies]
handwired-rs-macros = { path = "macros", version = "0.5.0" }

[workspace]
members = ["macros", "gpu", "run"]
# Resolver 2, so packaged crates stay readable by older Cargo (handwired-rs-run supports Rust 1.75).
resolver = "2"

[dev-dependencies]
sha1_smol = "1.0.1"
