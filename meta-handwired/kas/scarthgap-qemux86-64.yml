# Builds core-image-minimal with the runner and the example program for QEMU, and runs the layer's runtime tests:
#   kas build meta-handwired/kas/scarthgap-qemux86-64.yml
#   kas shell meta-handwired/kas/scarthgap-qemux86-64.yml -c "bitbake core-image-minimal -c testimage"
header:
  version: 14

machine: qemux86-64
distro: poky
target: core-image-minimal

repos:
  # This repository: the layer lives at meta-handwired/.
  handwired-rs:
    layers:
      meta-handwired:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

local_conf_header:
  handwired: |
    IMAGE_INSTALL:append = " handwired-run handwired-heater"
    IMAGE_FEATURES:append = " ssh-server-dropbear"
  testimage: |
    IMAGE_CLASSES:append = " testimage"
    # The tests log in over SSH as root with no password, which scarthgap images refuse without this.
    EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
    TEST_SUITES = "ping ssh handwired"
    TEST_RUNQEMUPARAMS += " slirp"
    TEST_QEMUBOOT_TIMEOUT = "1500"
  # Reuse the Yocto Project's shared state, so only what this layer adds is built.
  sstate: |
    SSTATE_MIRRORS ?= "file://.* http://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"
    BB_SIGNATURE_HANDLER = "OEEquivHash"
    BB_HASHSERVE = "auto"
    BB_HASHSERVE_UPSTREAM = "wss://hashserv.yoctoproject.org/ws"
