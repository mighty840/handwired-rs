# meta-handwired: run circuits exported by handwired-rs on Yocto/OpenEmbedded images.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "handwired"
BBFILE_PATTERN_handwired = "^${LAYERDIR}/"
BBFILE_PRIORITY_handwired = "6"

LAYERVERSION_handwired = "1"
LAYERDEPENDS_handwired = "core"
# Tested in CI on scarthgap (5.0 LTS, Rust 1.75; qemux86-64 and qemuarm64) and wrynose (6.0 LTS, SPDX 3.0).
LAYERSERIES_COMPAT_handwired = "scarthgap wrynose"
