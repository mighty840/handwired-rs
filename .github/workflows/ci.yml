name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (CPU and GPU on lavapipe)
    runs-on: ubuntu-24.04
    env:
      # GitHub's runners have no GPU: run the GPU tests on Mesa's software Vulkan,
      # and fail rather than skip if no adapter shows up.
      WGPU_ADAPTER_NAME: llvmpipe
      HANDWIRED_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa's software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace
      - name: Test without overflow checks (release)
        run: cargo test --workspace --release
      - name: Test the runner with std (the handwired-run command)
        run: cargo test -p handwired-rs-run --features std
      - name: Run the 100,000-record search example
        run: cargo run --release -p handwired-rs-gpu --example search
      - name: Run the key-value store example
        run: cargo run --release -p handwired-rs-gpu --example kv_store
      - name: Run the UI panel and Game of Life examples
        run: |
          cargo run --release --example ui_panel > /dev/null
          cargo run --release --example life > /dev/null
          cargo run --release --example fizzbuzz > /dev/null
      - name: Run the game balancing example
        run: cargo run --release --example balance
      - name: Run SHA-1 against sha1_smol
        run: cargo run --release --example sha1

  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (the runner with std)
        run: cargo clippy -p handwired-rs-run --all-targets --features std -- -D warnings

  embedded:
    name: Build the runner for microcontrollers (no_std)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cortex-M0 without an FPU (software floats), Cortex-M4F/M7 with one, and RISC-V without one.
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          for target in thumbv6m-none-eabi thumbv7em-none-eabihf riscv32imc-unknown-none-elf; do
            cargo build -p handwired-rs-run --lib --release --target "$target"
          done

  package:
    name: Package the macro crate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        # handwired-rs and handwired-rs-gpu depend on it, so they can only be packaged once it's published.
        run: |
          cargo package -p handwired-rs-macros
          cargo package -p handwired-rs-run
