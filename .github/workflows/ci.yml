name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (CPU and GPU on lavapipe)
    runs-on: ubuntu-24.04
    env:
      # GitHub's runners have no GPU: run the GPU tests on Mesa's software Vulkan,
      # and fail rather than skip if no adapter shows up.
      WGPU_ADAPTER_NAME: llvmpipe
      HANDWIRED_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa's software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace
      - name: Test without overflow checks (release)
        run: cargo test --workspace --release
      - name: Test the runner with std (the handwired-run command)
        run: cargo test -p handwired-rs-run --features std
      - name: Test signatures with std (the handwired-sign command)
        run: cargo test -p handwired-rs-sign --features std
      - name: Check the pinned signature and log with other Ed25519 and SHA-256 implementations
        run: |
          sudo apt-get install -y python3-cryptography
          python3 -I sign/tests/independent_check.py
      - name: The example's proof report is what its generator writes
        run: |
          files=meta-handwired/recipes-handwired/handwired-heater/files
          cargo run --release -p handwired-rs-sign --features log --example heater_report -- $files/heater.hwc /tmp/report.json
          cmp /tmp/report.json $files/heater.hwc.proof.json
      - name: Run the 100,000-record search example
        run: cargo run --release -p handwired-rs-gpu --example search
      - name: Run the key-value store example
        run: cargo run --release -p handwired-rs-gpu --example kv_store
      - name: Run the UI panel and Game of Life examples
        run: |
          cargo run --release --example ui_panel > /dev/null
          cargo run --release --example life > /dev/null
          cargo run --release --example fizzbuzz > /dev/null
      - name: Run the game balancing example
        run: cargo run --release --example balance
      - name: Run SHA-1 against sha1_smol
        run: cargo run --release --example sha1

  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (the runner with std)
        run: cargo clippy -p handwired-rs-run --all-targets --features std -- -D warnings
      - name: Clippy (signatures with std)
        run: cargo clippy -p handwired-rs-sign --all-targets --features std -- -D warnings

  embedded:
    name: Build the runner for microcontrollers (no_std)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cortex-M0 without an FPU (software floats), Cortex-M4F/M7 with one, and RISC-V without one.
          targets: thumbv6m-none-eabi, thumbv7em-none-eabihf, riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          for target in thumbv6m-none-eabi thumbv7em-none-eabihf riscv32imc-unknown-none-elf; do
            cargo build -p handwired-rs-run --lib --release --target "$target"
            cargo build -p handwired-rs-sign --lib --release --features log --target "$target"
          done

  qemu:
    name: Run the runner on emulated Cortex-M0 and Cortex-M3 (QEMU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Write the suite (programs, inputs and the host's outputs)
        run: cargo run --release -p handwired-rs-run --example hardware_suite -- run/hardware/firmware/suite.bin 60
      - name: Run it on QEMU's lm3s6965evb (Cortex-M3) and microbit (Cortex-M0)
        working-directory: run/hardware/firmware
        run: |
          set -o pipefail
          cargo build --release --features qemu --target thumbv7m-none-eabi
          cargo build --release --features qemu --target thumbv6m-none-eabi
          timeout 600 qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic \
            -semihosting-config enable=on,target=native \
            -kernel target/thumbv7m-none-eabi/release/handwired-run-check | tee m3.txt
          timeout 600 qemu-system-arm -machine microbit -nographic \
            -semihosting-config enable=on,target=native \
            -kernel target/thumbv6m-none-eabi/release/handwired-run-check | tee m0.txt
          grep -q "=== 8 passed, 0 failed ===" m3.txt
          grep -q "=== 8 passed, 0 failed ===" m0.txt

  package:
    name: Package the macro crate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        # handwired-rs and handwired-rs-gpu depend on it, so they can only be packaged once it's published.
        run: |
          cargo package -p handwired-rs-macros
          cargo package -p handwired-rs-run
          cargo package -p handwired-rs-sign
